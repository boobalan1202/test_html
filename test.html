<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Viewer</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            padding: 10px;
            text-align: center;
        }

        .nav {
            text-align: center;
            margin: 10px;
        }

        .nav button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .nav button:hover {
            background: #0056b3;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
    </style>
</head>

<body>

<header>
    <h2>Word Document Viewer (Google Drive)</h2>
</header>

<div class="nav">
    <button onclick="loadPage(1)">Page 1</button>
    <button onclick="loadPage(2)">Page 2</button>
    <button onclick="loadPage(3)">Page 3</button>
</div>

<iframe id="viewer"></iframe>

<script>
    const fileId = "1ABCXYZ123"; // 🔴 Replace with your Google Drive File ID

    function loadPage(page) {
        // Google viewer URL
        let url = "https://docs.google.com/gview?url=" +
                  "https://drive.google.com/uc?export=download&id=" + fileId +
                  "&embedded=true";

        document.getElementById("viewer").src = url;
    }

    // Load first page by default
    loadPage(1);
</script>

</body>
  </html>
