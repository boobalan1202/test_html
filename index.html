<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dancing Toy</title>

<style>
body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Toy body */
.toy {
    position: relative;
    width: 100px;
    height: 150px;
}

/* Head */
.head {
    width: 60px;
    height: 60px;
    background: yellow;
    border-radius: 50%;
    margin: auto;
}

/* Eyes */
.eye {
    width: 10px;
    height: 10px;
    background: black;
    border-radius: 50%;
    position: absolute;
    top: 20px;
}

.eye.left { left: 20px; }
.eye.right { right: 20px; }

/* Body */
.body {
    width: 80px;
    height: 80px;
    background: orange;
    margin: auto;
    border-radius: 10px;
}

/* Arms */
.arm {
    width: 15px;
    height: 60px;
    background: yellow;
    position: absolute;
    top: 60px;
}

.arm.left {
    left: -10px;
    transform-origin: top;
}

.arm.right {
    right: -10px;
    transform-origin: top;
}

/* Legs */
.leg {
    width: 15px;
    height: 60px;
    background: yellow;
    position: absolute;
    bottom: -60px;
}

.leg.left { left: 20px; }
.leg.right { right: 20px; }

/* Dancing animation */
@keyframes dance {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(10deg); }
    50% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
}

@keyframes armMove {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(40deg); }
    100% { transform: rotate(0deg); }
}

@keyframes legMove {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(-30deg); }
    100% { transform: rotate(0deg); }
}

/* Apply animations */
.toy {
    animation: dance 1s infinite;
}

.arm.left {
    animation: armMove 1s infinite;
}

.arm.right {
    animation: armMove 1s infinite reverse;
}

.leg.left {
    animation: legMove 1s infinite;
}

.leg.right {
    animation: legMove 1s infinite reverse;
}
</style>

</head>

<body>

<div class="toy">
    <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
    </div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>
</div>

</body>
</html>
